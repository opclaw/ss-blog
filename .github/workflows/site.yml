name: site

on:
  push:
    paths: ['site/**', 'legacy/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'legacy/**']
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Сборка + все проверки
        # build → сверка с legacy → sitemap актуален → JS → интерактив kit → QA (якоря, доступность) → SEO-аудит
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          include-hidden-files: true
