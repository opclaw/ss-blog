<!-- 
  ============================================
  JSON-LD Schema.org разметка для статьи блога
  Вставить в <head> каждой статьи
  Заменить значения в {{ двойных скобках }}
  ============================================
-->

<!-- 1. Статья (Article) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ЗАГОЛОВОК СТАТЬИ}}",
  "description": "{{ОПИСАНИЕ 150-160 СИМВОЛОВ}}",
  "image": "https://smartsolutions.today/images/blog/{{OG-IMAGE}}.jpg",
  "author": {
    "@type": "Person",
    "name": "Олег Кречетов",
    "url": "https://smartsolutions.today/ai.html",
    "jobTitle": "Основатель Smart Solutions"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Smart Solutions",
    "url": "https://smartsolutions.today",
    "logo": {
      "@type": "ImageObject",
      "url": "https://smartsolutions.today/logos/smartsolutions-logo.svg"
    }
  },
  "datePublished": "{{YYYY-MM-DD}}",
  "dateModified": "{{YYYY-MM-DD}}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://smartsolutions.today/blog/{{URL}}.html"
  },
  "wordCount": {{КОЛИЧЕСТВО СЛОВ}},
  "articleSection": "{{РУБРИКА: AI-агенты | Инструменты | SEO | Процессы | Управление | Отрасли}}",
  "keywords": "{{КЛЮЧЕВЫЕ СЛОВА ЧЕРЕЗ ЗАПЯТУЮ}}"
}
</script>
